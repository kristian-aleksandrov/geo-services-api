<svg width="100%" viewBox="0 0 680 860">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- CLIENT LAYER -->
  <g class="c-gray">
    <rect x="40" y="30" width="600" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Client / Frontend</text>
    <text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Leaflet.js map — HTTP requests + Agent protocol commands</text>
  </g>

  <line x1="340" y1="80" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>

  <!-- AZURE CONTAINER APPS -->
  <g class="c-blue">
    <rect x="40" y="110" width="600" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="132" text-anchor="middle" dominant-baseline="central">Azure Container Apps</text>
    <text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">FastAPI — Docker container, auto-scales to zero</text>
  </g>

  <line x1="340" y1="160" x2="340" y2="188" class="arr" marker-end="url(#arrow)"/>

  <!-- 4 ROUTERS -->
  <text class="ts" x="40" y="202" dominant-baseline="central">API routers</text>
  <g class="c-teal">
    <rect x="40" y="212" width="118" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="99" y="234" text-anchor="middle" dominant-baseline="central">/boundaries</text>
    <text class="ts" x="99" y="250" text-anchor="middle" dominant-baseline="central">countries, provinces</text>
  </g>
  <g class="c-teal">
    <rect x="170" y="212" width="118" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="229" y="234" text-anchor="middle" dominant-baseline="central">/layers</text>
    <text class="ts" x="229" y="250" text-anchor="middle" dominant-baseline="central">roads, rivers...</text>
  </g>
  <g class="c-teal">
    <rect x="300" y="212" width="118" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="359" y="234" text-anchor="middle" dominant-baseline="central">/statistics</text>
    <text class="ts" x="359" y="250" text-anchor="middle" dominant-baseline="central">spatial aggregations</text>
  </g>
  <g class="c-purple">
    <rect x="430" y="212" width="210" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="535" y="234" text-anchor="middle" dominant-baseline="central">/agent/chat</text>
    <text class="ts" x="535" y="250" text-anchor="middle" dominant-baseline="central">natural language query</text>
  </g>

  <!-- arrows from routers to repository -->
  <line x1="99"  y1="262" x2="99"  y2="310" class="arr" marker-end="url(#arrow)"/>
  <line x1="229" y1="262" x2="229" y2="310" class="arr" marker-end="url(#arrow)"/>
  <line x1="359" y1="262" x2="359" y2="310" class="arr" marker-end="url(#arrow)"/>

  <!-- agent to openai dashed -->
  <line x1="535" y1="262" x2="535" y2="430" class="arr" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- REPOSITORY -->
  <g class="c-gray">
    <rect x="40" y="312" width="450" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="265" y="334" text-anchor="middle" dominant-baseline="central">Repository layer (geo_repository.py)</text>
    <text class="ts" x="265" y="350" text-anchor="middle" dominant-baseline="central">Abstracts all PostGIS spatial queries — ST_Intersects, ST_Within</text>
  </g>

  <line x1="265" y1="362" x2="265" y2="390" class="arr" marker-end="url(#arrow)"/>

  <!-- DATABASE BOX -->
  <g class="c-green">
    <rect x="40" y="392" width="450" height="130" rx="8" stroke-width="0.5"/>
    <text class="th" x="265" y="414" text-anchor="middle" dominant-baseline="central">Azure Database for PostgreSQL + PostGIS</text>
  </g>
  <rect x="40" y="424" width="450" height="0.5" fill="none" stroke="#3B6D11" stroke-width="0.5"/>

  <!-- two columns of tables inside DB box -->
  <!-- left column -->
  <text class="ts" x="56" y="444" dominant-baseline="central">geo.countries — 258 records</text>
  <text class="ts" x="56" y="462" dominant-baseline="central">geo.provinces — 4,596 records</text>
  <text class="ts" x="56" y="480" dominant-baseline="central">geo.roads — 56,600 records</text>
  <text class="ts" x="56" y="498" dominant-baseline="central">geo.rivers — 1,473 records</text>
  <text class="ts" x="56" y="516" dominant-baseline="central">geo.railroads — 25,413 records</text>

  <!-- right column -->
  <text class="ts" x="265" y="444" dominant-baseline="central">geo.places — 7,342 records</text>
  <text class="ts" x="265" y="462" dominant-baseline="central">geo.protected_areas — 61 records</text>
  <text class="ts" x="265" y="480" dominant-baseline="central">geo.buildings — OSM Bulgaria</text>
  <text class="ts" x="265" y="498" dominant-baseline="central">geo.pois — OSM Bulgaria</text>
  <text class="ts" x="265" y="516" dominant-baseline="central">GIST + B-tree indexes on all tables</text>

  <!-- AZURE OPENAI -->
  <g class="c-purple">
    <rect x="510" y="392" width="130" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="575" y="414" text-anchor="middle" dominant-baseline="central">Azure OpenAI</text>
    <text class="ts" x="575" y="430" text-anchor="middle" dominant-baseline="central">GPT-4o tool calling</text>
  </g>

  <!-- openai back to agent -->
  <line x1="575" y1="392" x2="575" y2="286" class="arr" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text class="ts" x="620" y="340" text-anchor="middle">tools</text>

  <!-- AGENT PROTOCOL -->
  <text class="ts" x="40" y="544" dominant-baseline="central">Agent output</text>
  <g class="c-purple">
    <rect x="40" y="556" width="600" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="578" text-anchor="middle" dominant-baseline="central">Agent-to-Frontend protocol</text>
    <text class="ts" x="340" y="594" text-anchor="middle" dominant-baseline="central">Structured JSON commands → Leaflet map operations + API calls</text>
  </g>

  <!-- response back to client -->
  <line x1="620" y1="556" x2="638" y2="556" stroke="var(--color-border-secondary)" stroke-width="1"/>
  <line x1="638" y1="556" x2="638" y2="55" stroke="var(--color-border-secondary)" stroke-width="1"/>
  <line x1="638" y1="55" x2="642" y2="55" class="arr" marker-end="url(#arrow)"/>

  <!-- DATA SOURCES -->
  <text class="ts" x="40" y="630" dominant-baseline="central">Data sources</text>
  <g class="c-amber">
    <rect x="40" y="642" width="190" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="135" y="664" text-anchor="middle" dominant-baseline="central">Natural Earth 10m</text>
    <text class="ts" x="135" y="680" text-anchor="middle" dominant-baseline="central">Global vector layers</text>
  </g>
  <g class="c-amber">
    <rect x="245" y="642" width="190" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="664" text-anchor="middle" dominant-baseline="central">Geofabrik OSM Bulgaria</text>
    <text class="ts" x="340" y="680" text-anchor="middle" dominant-baseline="central">Buildings + POIs</text>
  </g>
  <g class="c-amber">
    <rect x="450" y="642" width="190" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="545" y="664" text-anchor="middle" dominant-baseline="central">Global Forest Watch</text>
    <text class="ts" x="545" y="680" text-anchor="middle" dominant-baseline="central">Planned extension</text>
  </g>

  <!-- DELIVERABLES -->
  <text class="ts" x="40" y="716" dominant-baseline="central">Deliverables</text>
  <g class="c-gray">
    <rect x="40" y="728" width="185" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="132" y="754" text-anchor="middle" dominant-baseline="central">GitHub repo + README</text>
  </g>
  <g class="c-gray">
    <rect x="238" y="728" width="185" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="330" y="754" text-anchor="middle" dominant-baseline="central">Azure architecture diagram</text>
  </g>
  <g class="c-gray">
    <rect x="436" y="728" width="204" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="538" y="754" text-anchor="middle" dominant-baseline="central">Agent protocol spec</text>
  </g>
</svg>